<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">APF 2K8 Mod Studio</title>
  <desc id="description">A football, four texture swatches, and an editing pen over a field.</desc>
  <defs>
