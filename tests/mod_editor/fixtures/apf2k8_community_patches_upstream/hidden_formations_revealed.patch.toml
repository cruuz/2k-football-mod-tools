[[patch]]
    name = "Hidden formations revealed: every offensive formation joins its family (Playbook Manager, in-game picker, and after picking a package)"
    desc = "Formations the game otherwise leaves out of their family are judged as the default formation of their tab: 3->I Form, 11->I Form, 15->Strong I, 25->Weak I, 112->Empty, 113->Empty, 116->Empty, 117->Empty. Also recognises formations taken from the playbook the menu is using, so grouping survives picking a package."
