title_name = "All-Pro Football 2K8"
title_id = "54540807"
hash = "CEA825F7C2012F5A"

[[patch]]
    name = "All packages in substitution menu: Substitution screen lists every package (main menu and in game) in a custom order"
    desc = "(1) 0x84A7041C: the playbook-independent second pass accepts every package, not just special teams. (2) 0x84A70468 -> stub 0x84D0D580: Trio (row 5) has no formation in MASTER, so it borrows formation 107 (Ace Trips Open). (3) 0x84A703EC: the second pass also runs in game (the stock code skips it in game, which is why Trio and a few others were missing there). (4) 0x84A70484 -> sort stub 0x84D0D5A0 reorders the finished list with a rank table at 0x84D0D680: Load, Jacks, Jokers, Pro Set, Queens, Ace, Kings, Flush, Trio, Straight, 5 Wide, Goalline, 5-2 Big, 4-3, 3-4, Nickel, Nickel 3-3, Dime, Dime 3-2, Prevent, Punt, Punt Return, Field Goal, Block FG, Kickoff, Kick Return, Onside Kickoff Team, Onside Kickoff Return Team (5) 0x84A707BC -> sort stub 0x84D0D6A0: after the By Formation list is built, each formation is moved right behind the last earlier formation of its family (family table at 0x84D0DB00, generated from the game's own same-row test), so newly added formations sit with their parents; Hail Mary is left alone. Also uses 0x84D0D6A0..0x84D0D7E7, 0x84D0DB00..0x84D0DBAF and 0x84D0D580..0x84D0D593, 0x84D0D5A0..0x84D0D64F and 0x84D0D680..0x84D0D69F."
    author = "Basileus Maximus"
    is_enabled = true

