[[patch]]
    name = "Play calling by package fixed: every package selectable + package applies to every formation; Punt/Field Goal/kicking packages open their own formations"
    desc = "The formation list, stepper and card builder walk the whole tab (every formation) for scrimmage packages, but for the special-teams packages (categories 15-25: Punt, Punt Return, Field Goal, Block FG, Kickoff etc.) they walk only that package formations, so Punt and Field Goal open the punt / field-goal formations (stub at 0x84D0D500); the package is no longer cleared when the shown formation is outside it (0x84A27DE4) or on up/down (0x84A2A448). The package picker (0x84A2DD30/0x84A2DDB4, and the matching counter at 0x84A2D3E8/0x84A2D428/0x84A2D408) temporarily advertises all 28 categories while it lists packages, so every package appears even if the playbook has no formation using it. Uses caves 0x84D0D400..0x84D0D4E4 and 0x84D0D500..0x84D0D568."
    author = "Basileus Maximus"
    is_enabled = true

